name: Bezpieczeństwo bibliotek

# Co tydzień sprawdza znane podatności w bibliotekach (npm audit).
# Gdy coś znajdzie, przebieg kończy się błędem – GitHub wyśle e-mail do właściciela repozytorium.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
